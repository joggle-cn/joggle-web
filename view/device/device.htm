<div id="device-page" class="console-page cs-subpage">
    <div ng-include="'view/console/partials/topbar.htm'"></div>

    <div class="cs-layout">
        <div ng-include="'view/console/partials/sidebar.htm'"></div>

        <main class="cs-main">
            <section class="cs-page-head">
                <div>
                    <h1>我的设备</h1>
                    <p>管理已绑定设备，点击设备可进入映射管理。</p>
                </div>
                <div class="cs-head-actions">
                    <a class="cs-main-btn" href="#/user/device/bind"><i class="fa fa-magnet"></i>&nbsp;绑定设备</a>
                </div>
            </section>

            <div class="cs-empty" ng-if="list.length == 0">
                您还没有绑定设备，先去<a href="#/download">下载客户端</a>并运行绑定吧。
            </div>

            <section class="cs-device-grid" ng-if="list.length > 0">
                <a class="cs-device-card" href="#/user/device/{{item.id}}/mapping" ng-repeat="item in list">
                    <div class="cs-device-icon">
                        <i class="fa fa-server"></i>
                        <span class="cs-status-dot" ng-class="item.status == 1 ? 'cs-status-online' : 'cs-status-offline'"></span>
                    </div>
                    <div class="cs-device-meta">
                        <h3>{{item.name || '未命名设备'}}</h3>
                        <p>设备编码：{{item.deviceNo}}</p>
                        <p>内网地址：{{item.intranetIp}}</p>
                    </div>
                </a>
            </section>

            <div class="cs-legend" ng-if="list.length > 0">
                <span><i class="cs-status-dot cs-status-online"></i>在线</span>
                <span><i class="cs-status-dot cs-status-offline"></i>离线</span>
            </div>
        </main>
    </div>
</div>
