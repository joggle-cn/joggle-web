<div id="wol-page" class="console-page cs-subpage">
    <div ng-include="'view/console/partials/topbar.htm'"></div>

    <div class="cs-layout">
        <div ng-include="'view/console/partials/sidebar.htm'"></div>

        <main class="cs-main">
            <section class="cs-page-head">
                <div>
                    <h1>网络唤醒</h1>
                    <p>输入目标设备 MAC 地址，向在线客户端发送唤醒任务。</p>
                </div>
            </section>

            <section class="cs-form-card">
                <div class="input-group">
                    <input type="text" ng-model="macAddress" class="form-control" placeholder="请输入设备MAC地址">
                    <span class="input-group-btn">
                        <button id="bindWolButton" ng-click="wolDevice()" type="button" class="btn btn-success">立即唤醒</button>
                    </span>
                </div>

                <div style="padding-top: 16px;">
                    <div class="progress" id="progress-bar" style="visibility: hidden;">
                        <div class="progress-bar progress-bar-striped active" role="progressbar" aria-valuenow="45" aria-valuemin="0" aria-valuemax="100" style="width: 45%;">
                            <span class="sr-only">45%</span>
                        </div>
                    </div>
                    <p style="text-align: center;" ng-bind="info">正在广播唤醒设备...</p>
                </div>

                <p class="cs-form-tip">
                    说明：网络唤醒会通过 Joggle 协议消息发送给在线客户端，再由客户端向对应 MAC 地址发送魔术包完成远程唤醒。
                </p>
            </section>
        </main>
    </div>
</div>
