<div id="bind-device-page" class="console-page cs-subpage">
    <div ng-include="'view/console/partials/topbar.htm'"></div>

    <div class="cs-layout">
        <div ng-include="'view/console/partials/sidebar.htm'"></div>

        <main class="cs-main">
            <section class="cs-page-head">
                <div>
                    <h1>绑定设备</h1>
                    <p>输入设备编码完成绑定，或从自动发现列表中一键选择。</p>
                </div>
            </section>

            <section class="cs-form-card">
                <div class="input-group">
                    <input type="text" ng-model="deviceId" class="form-control" placeholder="请输入设备编码">
                    <span class="input-group-btn">
                        <button id="bindButton" ng-click="validate()" type="button" class="btn btn-success">绑定设备</button>
                    </span>
                </div>

                <div style="padding-top: 16px;">
                    <div class="progress" id="progress-bar" style="visibility: hidden;">
                        <div class="progress-bar progress-bar-striped active" role="progressbar" aria-valuenow="45" aria-valuemin="0" aria-valuemax="100" style="width: 45%;">
                            <span class="sr-only">45%</span>
                        </div>
                    </div>
                    <p style="text-align: center;" ng-bind="info">正在为连接校验服务器...</p>
                </div>

                <p class="cs-form-tip">
                    说明：下载 Joggle 客户端并运行后，可基于设备发现选择可绑定设备。
                </p>
            </section>

            <div class="alert alert-success" role="alert" ng-show="discovery.length > 0" style="margin-top: 12px;">
                已发现可绑定设备，点击卡片可快速填充设备编码。
            </div>

            <div class="cs-discovery-grid" ng-show="discovery.length > 0">
                <div class="cs-discovery-item" ng-repeat="a in discovery track by $index" ng-click="selectDeviceNo(a.deviceNo)">
                    <span class="label label-info">{{a.deviceNo}}</span>
                    <p>{{a.intranetIp}}</p>
                </div>
            </div>
        </main>
    </div>
</div>
