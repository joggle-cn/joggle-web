<div id="certification-page" class="console-page cs-subpage">
    <div ng-include="'view/console/partials/topbar.htm'"></div>

    <div class="cs-layout">
        <div ng-include="'view/console/partials/sidebar.htm'"></div>

        <main class="cs-main">
            <section class="cs-page-head">
                <div>
                    <h1>实名认证</h1>
                    <p>请提交真实身份信息用于账号安全与服务合规校验。</p>
                </div>
                <div class="cs-head-actions">
                    <span class="cs-cert-status" ng-class="certStatusClass">
                        <i class="fa" ng-class="certStatusIcon"></i>
                        {{certStatusText}}
                    </span>
                </div>
            </section>

            <section class="cs-cert-layout">
                <article class="cs-cert-form-card">
                    <header class="cs-cert-form-head">
                        <h3>用户实名认证</h3>
                        <p>请确保姓名、身份证号、手机号均为本人信息。</p>
                    </header>

                    <div class="cs-cert-policy">
                        根据
                        <a target="_blank" href="https://www.gov.cn/xinwen/2022-06/14/content_5695690.htm">《移动互联网应用程序信息服务管理规定》</a>
                        要求，平台需对用户进行真实身份信息认证。
                    </div>

                    <div class="cs-cert-tip reject" ng-if="certStatusValue === 2 && certRejectMsg">
                        <i class="fa fa-exclamation-circle"></i>
                        驳回原因：{{certRejectMsg}}
                    </div>
                    <div class="cs-cert-tip success" ng-if="submitSuccess">
                        <i class="fa fa-check-circle"></i>
                        提交成功，请等待系统审核结果。
                    </div>

                    <form class="cs-cert-form" ng-submit="submitData()">
                        <label class="cs-cert-field">
                            <span>姓名</span>
                            <input type="text" ng-model="data.realName" placeholder="请输入真实姓名">
                        </label>

                        <label class="cs-cert-field">
                            <span>认证类型</span>
                            <select ng-model="data.type">
                                <option value="1">中国居民身份证</option>
                            </select>
                        </label>

                        <label class="cs-cert-field">
                            <span>身份证号码</span>
                            <input type="text" ng-model="data.idcard" placeholder="请输入身份证号码">
                        </label>

                        <label class="cs-cert-field">
                            <span>手机号</span>
                            <input type="text" ng-model="data.phone" placeholder="请输入实名认证手机号">
                        </label>

                        <div class="cs-cert-field">
                            <span>验证码</span>
                            <div class="cs-cert-sms-row">
                                <input type="text" ng-model="data.code" placeholder="请输入短信验证码">
                                <button type="button"
                                        class="cs-ghost-btn"
                                        ng-click="getSmsCode()"
                                        ng-disabled="smsDisabled">
                                    {{smsButtonText}}
                                </button>
                            </div>
                        </div>

                        <div class="cs-cert-submit">
                            <button id="submitUcData"
                                    type="submit"
                                    class="cs-main-btn"
                                    ng-disabled="submitDisabled">
                                {{submitDisabled ? '提交中...' : '提交认证'}}
                            </button>
                        </div>
                    </form>
                </article>

                <aside class="cs-cert-guide-card">
                    <h3>常见失败原因</h3>
                    <ul class="cs-cert-guide-list">
                        <li>姓名与身份证号码不一致。</li>
                        <li>身份证信息尚未完成公安系统同步。</li>
                        <li>身份证号码无效或存在输入错误。</li>
                        <li>近期办理迁户、改名、证件更新导致信息未同步。</li>
                        <li>使用非本人手机号进行认证。</li>
                    </ul>

                    <div class="cs-cert-actions">
                        <a class="cs-ghost-btn" href="#/user/profile">返回我的资料</a>
                        <a class="cs-ghost-btn" href="#/feedback">提交问题反馈</a>
                    </div>
                </aside>
            </section>
        </main>
    </div>
</div>
